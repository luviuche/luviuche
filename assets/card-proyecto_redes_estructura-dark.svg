<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 168" width="470" height="168" role="img" aria-label="Project Network Analyzer project card" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="469" height="167" rx="11" fill="#0d1117" stroke="#30363d"/><text x="22" y="34" font-size="14.5" font-weight="700" fill="#3B82F6">Project Network Analyzer</text><text x="22" y="52" font-size="10.5" font-family="monospace" fill="#8b949e">proyecto_redes_estructura</text><text x="22" y="78" font-size="12" fill="#e6edf3">Models a project plan as a directed acyclic graph, computes the</text><text x="22" y="95" font-size="12" fill="#e6edf3">critical path, and hands the result to a hybrid agent -</text><text x="22" y="112" font-size="12" fill="#e6edf3">deterministic rules plus an LLM - that explains the schedule in</text><text x="22" y="129" font-size="12" fill="#e6edf3">plain language.</text><line x1="22" y1="134" x2="448" y2="134" stroke="#30363d"/><circle cx="27" cy="150" r="5" fill="#3572A5"/><text x="38" y="154" font-size="11" fill="#8b949e">Python</text><text x="85.2" y="154" font-size="11" fill="#8b949e">Updated May 2026</text></svg>