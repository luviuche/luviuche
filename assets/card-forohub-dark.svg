<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 168" width="470" height="168" role="img" aria-label="ForoHub API project card" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><rect x="0.5" y="0.5" width="469" height="167" rx="11" fill="#0d1117" stroke="#30363d"/><text x="22" y="34" font-size="14.5" font-weight="700" fill="#3B82F6">ForoHub API</text><text x="22" y="52" font-size="10.5" font-family="monospace" fill="#8b949e">forohub</text><text x="22" y="78" font-size="12" fill="#e6edf3">RESTful discussion-forum API in Spring Boot with JWT authentication,</text><text x="22" y="95" font-size="12" fill="#e6edf3">validation and persistence. The closest thing here to production</text><text x="22" y="112" font-size="12" fill="#e6edf3">backend work.</text><line x1="22" y1="134" x2="448" y2="134" stroke="#30363d"/><circle cx="27" cy="150" r="5" fill="#b07219"/><text x="38" y="154" font-size="11" fill="#8b949e">Java</text><text x="72.8" y="154" font-size="11" fill="#8b949e">Updated Mar 2026</text></svg>